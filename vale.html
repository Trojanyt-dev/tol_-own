<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💕</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 45px 35px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: float 5s ease-in-out infinite;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    h2 {
      color: #fff;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 26px;
      font-size: 1rem;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
    }

    .yes {
      background: #ff4d6d;
      color: #fff;
      box-shadow: 0 10px 25px rgba(255,77,109,0.5);
    }

    .yes:hover {
      transform: scale(1.08);
    }

    .no {
      background: #fff;
      color: #ff4d6d;
    }

    .message {
      margin-top: 30px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      display: none;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 22px;
      animation: rise 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      15% { opacity: 0.9; }
      100% { transform: translateY(-110vh) scale(1.6); opacity: 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hey Momma 💘</h1>
    <p>
      I was thinking about you, smiling like an idiot,
      and then I realized I had to ask...
    </p>

    <h2>Will you be my Valentine? 💖</h2>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💕</button>
      <button class="no" id="noBtn" onclick="plead()">No 😅</button>
    </div>

    <div class="message" id="message">
      You said YES?! 😭💞 I’m so happy! 💐🥰
    </div>
  </div>

  <script>
    const pleas = [
      'Are you sure? 🥺',
      'Pleaseeee 💔',
      'I’ll be really nice 😢',
      'Just think about it 😭',
      'Don’t break my heart 💘',
      'I brought chocolates 🍫',
      'Okay last chance… 🥹'
    ];

    let pleaIndex = 0;

    function plead() {
      const noBtn = document.getElementById('noBtn');
      noBtn.textContent = pleas[pleaIndex];
      pleaIndex = (pleaIndex + 1) % pleas.length;

      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function sayYes() {
      const msg = document.getElementById('message');
      msg.style.display = 'block';
      createHearts();
    }

    function createHearts() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = 4 + Math.random() * 3 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }
    }
  </script>

</body>
</html>
